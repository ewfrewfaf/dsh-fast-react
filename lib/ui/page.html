<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>随叫随到</title>
<style>
  :root{
    /* ══ DSH 官方主题 token：同源 iframe 内由底部脚本从父页面实时同步；
       独立打开（无父页）时用这里的 fallback（深色，与 DSH 暗色一致）══ */
    --dsw-alias-bg-base:#0d1117;
    --dsw-alias-bg-layer-1:#161b22;
    --dsw-alias-bg-layer-2:#1c2128;
    --dsw-alias-bg-overlay:#1c2128;
    --dsw-alias-border-l1:#30363d;
    --dsw-alias-border-l2:#3d444d;
    --dsw-alias-border-l3:#4b545d;
    --dsw-alias-border-l4:#59636d;
    --dsw-alias-brand-primary:#1f6feb;
    --dsw-alias-label-primary:#e6edf3;
    --dsw-alias-label-secondary:#8b949e;
    --dsw-alias-label-tertiary:#6e7681;
    --dsw-alias-label-caption:#6e7681;
    --dsw-alias-state-success-primary:#3fb950;
    --dsw-alias-state-warn-primary:#d29922;
    --dsw-alias-state-error-primary:#f85149;
    --dsw-alias-state-idle-primary:#6e7681;
    --dsw-alias-state-business-primary:#1f6feb;
    /* 交互/容器类（原生 composer 用的就是这些） */
    --dsw-alias-button-info-fill:#1f6feb;
    --dsw-alias-button-info-hover:#388bfd;
    --dsw-alias-button-floating-fill:#21262d;
    --dsw-alias-button-floating-hover:#30363d;
    --dsw-alias-interactive-bg-hover:rgba(177,186,196,.12);
    --dsw-alias-interactive-bg-hover-solid:#21262d;
    --dsw-specific-input-major:#161b22;
    --dsw-specific-menu:#1c2128;
    --dsw-specific-selector:#21262d;
    --dsw-alias-separator-primary:#30363d;
    --dsw-alias-scrollbar-bg-l2:var(--tint-line);
    --dsw-alias-scrollbar-hover-l2:rgba(177,186,196,.34);
    --dsw-alias-markdown-code-block:#161b22;
    --dsw-radius-xs:4px; --dsw-radius-sm:6px; --dsw-radius-md:8px;
    --dsw-radius-lg:12px; --dsw-radius-xl:16px; --dsw-radius-panel:12px;
    --dsw-elevation-soft:0 8px 24px rgba(0,0,0,.35);
    --dsw-elevation-panel:0 12px 32px rgba(0,0,0,.5);
    --dsw-elevation-prominent:0 18px 48px rgba(0,0,0,.55);
    --dsw-menu-backdrop-filter:blur(40px) saturate(150%);
    --dsw-font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --dsw-static-blue-450:#2f81f7;

    /* 语义别名：全站颜色只从这里取 */
    --bg:var(--dsw-alias-bg-base); --bg2:var(--dsw-alias-bg-layer-1); --bg3:var(--dsw-alias-bg-layer-2);
    --line:var(--dsw-alias-border-l1); --line2:var(--dsw-alias-border-l2);
    --fg:var(--dsw-alias-label-primary); --fg2:var(--dsw-alias-label-secondary); --muted:var(--dsw-alias-state-idle-primary);
    --accent:#1f6feb;
    --ok:var(--dsw-alias-state-success-primary); --warn:var(--dsw-alias-state-warn-primary); --err:var(--dsw-alias-state-error-primary);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* 面板/浮层底色：跟随 DSH 会话区实底色（父页同步覆盖），这里给安全兜底 */
    --dsh-chat-content-width:748px;
    --panel-fill:var(--dsw-alias-bg-base);
    --glass-bg:color-mix(in srgb, var(--panel-fill) 52%, transparent);
    --glass-bg-strong:color-mix(in srgb, var(--panel-fill) 72%, transparent);
    --glass-blur:var(--dsw-menu-backdrop-filter, blur(40px) saturate(150%));
    --surface-popup:color-mix(in srgb, var(--dsw-specific-menu) 52%, transparent);
    --elev-popup:0 18px 48px rgba(0,0,0,.5);
    --composer-bg:color-mix(in srgb, var(--panel-fill) 82%, var(--fg) 18%);
    --composer-bg-focus:color-mix(in srgb, var(--panel-fill) 76%, var(--fg) 24%);
    --glass-border:var(--dsw-alias-border-l2);
    --accent2:#39d0d8;
    --knob:#d8dde3;
    /* 半透明遮罩/描边在浅色下要反过来 */
    --tint-weak:rgba(177,186,196,.06);
    --tint-hover:rgba(177,186,196,.12);
    --tint-line:rgba(177,186,196,.16);
    --user-bubble:var(--dsw-specific-menu);
  }
  /* ★ 浅色模式：DOM 上有 data-fr-theme="light" 时（由主题同步脚本按父页判断写入） */
  :root[data-fr-theme="light"]{
    --panel-fill:var(--dsw-alias-bg-base,#ffffff);
    --tint-weak:rgba(0,0,0,.035);
    --tint-hover:rgba(0,0,0,.06);
    --tint-line:rgba(0,0,0,.10);
    --user-bubble:#e8e8ea;
    --dsw-alias-scrollbar-bg-l2:rgba(0,0,0,.12);
    --dsw-alias-scrollbar-hover-l2:rgba(0,0,0,.28);
    --dsw-elevation-soft:0 8px 24px rgba(0,0,0,.10);
    --dsw-elevation-panel:0 12px 32px rgba(0,0,0,.14);
    --dsw-elevation-prominent:0 18px 48px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box}
  /* 实例徽标（2026-11-07）：并行跑多个流水线时区分 "这是哪一个" */
  .inst-badge{display:none;margin-left:8px;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600;
    letter-spacing:.03em;border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);
    vertical-align:middle}
  .inst-badge.on{display:inline-block}
  .inst-badge.b{border-color:color-mix(in srgb, var(--warn) 45%, transparent);color:var(--warn);background:color-mix(in srgb, var(--warn) 12%, transparent)}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--panel-fill,var(--bg));color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* 极简顶栏：无底色填充，只保留底部一条对齐的分割线 */
  /* 顶栏 = DSH 页签行同款（实测：26px 高、灰线 1px var(--tint-line)、
     左起点 x=284 = padding 20；chrome bar 占上方 50px 对应 DSH titleRow） */
  header{display:flex;align-items:center;gap:10px;height:26px;box-sizing:border-box;padding:0 20px;background:transparent;border-bottom:1px solid var(--tint-line);flex:0 0 auto;overflow:hidden;white-space:nowrap}
  header .chips{display:flex;gap:6px;flex:0 0 auto}
  header .chip{padding:1px 8px;font-size:11px;border-radius:999px}
  header button{padding:2px 10px;font-size:12px;border-radius:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .dot.busy{background:var(--warn);box-shadow:0 0 7px var(--warn);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .title{font-weight:500;font-size:13px;letter-spacing:.2px;color:var(--fg2);display:none} /* 标题在 chrome bar，避免重复 */
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:2px 10px;border:0;border-radius:999px;background:var(--tint-weak);font-size:11.5px;color:var(--fg2);white-space:nowrap}
  .chip b{color:var(--fg);font-weight:600}
  .grow{flex:1}
  button{cursor:pointer;border:0;background:var(--dsw-alias-button-floating-fill);color:var(--fg);padding:6px 12px;border-radius:8px;font-size:12.5px;font-family:inherit;transition:.14s}
  button:active:not(:disabled){transform:scale(.97)}   /* 按压反馈（2026-11-15） */
  button:hover:not(:disabled){background:var(--dsw-alias-button-floating-hover)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:color-mix(in srgb, var(--accent) 85%, #000);border-color:color-mix(in srgb, var(--accent) 85%, #000);color:#fff;filter:brightness(1.06)}
  button.ghost{background:transparent}
  button.icon{padding:0 9px;font-size:14px;line-height:1;height:22px;min-height:22px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}

  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
  #chat{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:20px 22px 8px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:calc(var(--dsh-chat-content-width,748px) + 32px);margin:0 auto}
  /* ★ 2026-10-24：滑条不再突兀——固定占位（scrollbar-gutter）避免内容跳动；
     细滑条 + 半透明，悬停聊天区才加深；Firefox 用 scrollbar-width/color */
  #chat{scrollbar-width:thin;scrollbar-color:var(--tint-line) transparent}
  #chat:hover{scrollbar-color:var(--dsw-alias-scrollbar-hover-l2) transparent}
  #chat::-webkit-scrollbar{width:10px;height:10px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:var(--tint-line);border-radius:6px;border:2px solid transparent;background-clip:content-box;transition:background .18s ease}
  #chat:hover::-webkit-scrollbar-thumb{background:var(--dsw-alias-scrollbar-hover-l2);background-clip:content-box}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:520px;line-height:2}
  .empty-title{font-size:40px;font-weight:600;letter-spacing:20px;padding-left:20px;color:var(--fg2);opacity:.92;line-height:1.4;transform:translateY(-4%)}
  .empty b{color:var(--fg2);display:block;margin-bottom:10px;font-size:16px}
  .empty code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:12px var(--mono);color:var(--accent)}

  /* 消息：DSH 同款 —— 不标人（只有两个角色），用户=浅灰气泡右对齐，Agent=纯文本左侧 */
  .msg{display:flex;max-width:min(92%,900px)}
  .msg.me{align-self:flex-end}
  .avatar{display:none}
  .bubble{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bubble .who{display:none}
  .bubble .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:var(--fg)}
  .msg.me .bubble .txt{background:var(--user-bubble);border-radius:18px;padding:10px 16px;border:1px solid var(--tint-line)}
  .msg:not(.me) .bubble .txt{background:transparent;padding:0 2px}
  /* 思考过程：浅灰折叠块（默认收起，点开看推理） */
  .think{margin:0 0 8px}
  .think summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;background:var(--tint-weak);border:1px solid var(--tint-hover);border-radius:999px;padding:4px 12px;user-select:none}
  .think summary::-webkit-details-marker{display:none}
  .think summary::before{content:'▸';font-size:10px;opacity:.8;transition:transform .15s}
  .think[open] summary::before{transform:rotate(90deg)}
  .think summary:hover{color:var(--fg2);background:var(--tint-hover)}
  .think .tt{margin-top:7px;padding:9px 13px;background:var(--tint-weak);border-left:2px solid var(--tint-line);border-radius:0 10px 10px 0;color:var(--muted);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
  /* 运行指示：前台在跑时必须有反馈，否则看起来像死了 */
  .msg.typing{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;padding:2px 4px}
  .dots{display:inline-flex;gap:3px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--fg2);display:block;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.22;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  /* 可操作通知（T3 确认 / 哨兵 / 上交）：必须显眼，否则用户看不到卡点 */
  .notice{align-self:center;max-width:86%;font-size:12.5px;line-height:1.65;color:var(--warn);background:color-mix(in srgb, var(--warn) 9%, transparent);border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);border-radius:10px;padding:7px 13px;white-space:pre-wrap;word-break:break-word}
  /* 便捷功能：快捷模板 / 悬停复制 */
  .copy{position:absolute;top:-9px;right:8px;opacity:0;pointer-events:none;cursor:pointer;font-size:11px;color:var(--fg2);background:var(--dsw-specific-menu);border:1px solid var(--tint-line);border-radius:999px;padding:2px 9px;transition:.12s;font-family:inherit}
  .msg .bubble{position:relative}
  .msg:hover .copy{opacity:1;pointer-events:auto}
  .copy:hover{color:var(--fg);border-color:var(--tint-line)}
  /* 发送即打断开关（胶囊式 toggle） */
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid var(--tint-line);background:transparent;transition:.15s}
  .switch:hover{background:var(--tint-hover)}
  .switch input{display:none}
  .switch .slider{position:relative;width:30px;height:17px;border-radius:999px;background:var(--tint-line);transition:.15s;flex:0 0 auto}
  .switch .slider::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--knob);transition:.15s}
  .switch .sw-lbl{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .switch input:checked + .slider{background:#c2453d}
  .switch input:checked + .slider::after{transform:translateX(13px);background:#fff}
  .switch input:checked ~ .sw-lbl{color:var(--err)}

  footer{flex:0 0 auto;padding:10px 18px 16px;background:transparent}
  /* DSH 同款输入栏（实测：bg rgb(44,44,46) 浅灰 / 圆角 28 / 无边框 / 无投影） */
  .composer{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--composer-bg);border:1px solid transparent;border-radius:24px;padding:14px 16px 9px;transition:.15s;width:100%;max-width:calc(var(--dsh-chat-content-width,748px) + 32px);margin:0 auto;box-shadow:none}
  .composer:focus-within{outline:none}
  .composer textarea{width:100%;min-height:52px;max-height:210px;resize:none;background:transparent;color:var(--fg);border:0;outline:none;font:14.5px/1.6 inherit;padding:2px 4px}
  .composer textarea::placeholder{color:var(--muted)}
  /* ★ 输入栏滑条：与聊天区同款灰（2026-11-07） */
  .composer textarea{scrollbar-width:thin;scrollbar-color:var(--tint-line) transparent}
  .composer textarea:hover{scrollbar-color:var(--dsw-alias-scrollbar-hover-l2) transparent}
  .composer textarea::-webkit-scrollbar{width:8px;height:8px}
  .composer textarea::-webkit-scrollbar-track{background:transparent}
  .composer textarea::-webkit-scrollbar-thumb{background:var(--tint-line);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  .composer textarea:hover::-webkit-scrollbar-thumb{background:var(--dsw-alias-scrollbar-hover-l2);background-clip:content-box}
  .composer .bar{display:flex;align-items:center;gap:8px}
  .composer .bar .hint{font-size:11.5px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;white-space:nowrap}
  /* 胶囊按钮（DSH 权限胶囊同款：透明底 + 细描边） */
  .composer .pill{background:transparent;border:1px solid var(--tint-line);color:var(--fg2);border-radius:999px;padding:6px 14px;font-size:12.5px}
  .composer .pill:hover{background:var(--tint-hover);color:var(--fg);border-color:var(--tint-line)}
  /* 模型切换器：DSH 同位置（输入栏右下、发送键左侧），透明底 8px 圆角 28px 高 */
  #btnModel,#btnMode,#btnPerm{display:flex;align-items:center;gap:5px;height:28px;padding:0 9px;background:transparent;border:0;border-radius:8px;color:var(--fg2);font-size:13px;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnModel:hover,#btnMode:hover,#btnPerm:hover{background:var(--tint-hover);color:var(--fg)}
  #btnModel .caret,#btnMode .caret,#btnPerm .caret{font-size:10px;opacity:.7}
  #modelMenu,#frModeMenu{position:absolute;right:56px;bottom:56px;min-width:260px;max-height:320px;overflow:auto;background:var(--surface-popup);border:0;border-radius:var(--dsw-radius-lg);padding:6px;box-shadow:var(--dsw-elevation-panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);display:none;z-index:30}
  #modelMenu.show,#frModeMenu.show{display:block;animation:frMenuUp .18s var(--fr-ease) both;transform-origin:50% 100%}
  #permQuickMenu{position:absolute;right:56px;bottom:56px;min-width:220px;max-height:300px;overflow:auto;background:var(--surface-popup);border:0;border-radius:var(--dsw-radius-lg);padding:6px;box-shadow:var(--dsw-elevation-panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);display:none;z-index:30}
  #permQuickMenu.show{display:block;animation:frMenuUp .18s var(--fr-ease) both;transform-origin:50% 100%}
  /* 三个下拉菜单统一细滚动条（与聊天区一致，避免突兀系统粗条） */
  #modelMenu::-webkit-scrollbar,#frModeMenu::-webkit-scrollbar,#permQuickMenu::-webkit-scrollbar{width:8px}
  #modelMenu::-webkit-scrollbar-track,#frModeMenu::-webkit-scrollbar-track,#permQuickMenu::-webkit-scrollbar-track{background:transparent}
  #modelMenu::-webkit-scrollbar-thumb,#frModeMenu::-webkit-scrollbar-thumb,#permQuickMenu::-webkit-scrollbar-thumb{background:var(--tint-line);border-radius:5px;border:2px solid transparent;background-clip:content-box}
  #modelMenu:hover::-webkit-scrollbar-thumb,#frModeMenu:hover::-webkit-scrollbar-thumb,#permQuickMenu:hover::-webkit-scrollbar-thumb{background:var(--dsw-alias-scrollbar-hover-l2);background-clip:content-box}
  #modelMenu,#frModeMenu,#permQuickMenu{scrollbar-width:thin;scrollbar-color:var(--tint-line) transparent}
  #permQuickMenu .grp{padding:6px 10px 3px;font-size:11px;color:var(--muted);letter-spacing:.3px}
  #permQuickMenu .op{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
  #permQuickMenu .op:hover{background:var(--tint-hover)}
  #permQuickMenu .op.cur{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent)}
  #modelMenu .grp,#frModeMenu .grp{padding:6px 10px 3px;font-size:11px;color:var(--muted);letter-spacing:.3px}
  #modelMenu .op,#frModeMenu .op{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
  #modelMenu .op:hover,#frModeMenu .op:hover{background:var(--tint-hover)}
  #modelMenu .op.cur,#frModeMenu .op.cur{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent)}
  #frModeTip{position:fixed;z-index:60;display:none;max-width:300px;padding:8px 10px;background:var(--glass-bg-strong);border:1px solid var(--tint-line);border-radius:10px;font:12px/1.55 system-ui;color:var(--fg);box-shadow:var(--dsw-elevation-panel);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);pointer-events:none;white-space:normal}
  #modelMenu .op .badge,#frModeMenu .op .badge{margin-left:auto;font-size:10.5px;color:var(--muted)}
    /* ★ 2026-11-10：与 DSH 原生 composer 主按钮完全对齐
     原生规格：.GRgSLq_primary{width:34px;height:34px;border-radius:999px;
               background:var(--dsw-alias-button-info-fill);translateY(-2px)}
     运行中切换为"停止"：同一个按钮变方块（原生也是同一颗按钮换图标） */
  .send{width:34px;height:34px;border-radius:999px;background:var(--dsw-alias-button-info-fill);border:0;color:#fff;font-size:17px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;transition:background-color .12s,transform .12s;transform:translateY(-2px)}
  .send:hover:not(:disabled){background:var(--dsw-alias-button-info-hover)}
  .send:disabled{opacity:.4;cursor:not-allowed}
  /* 运行中 = 停止按钮：方块图标 */
  .send.stopping{background:var(--dsw-alias-button-info-fill)}
  .send .sq{width:11px;height:11px;border-radius:2.5px;background:#fff;display:block}
  .send .arrow{display:block;line-height:1}

  /* ★ 动效语言（2026-11-15）：统一减速曲线 + 弹层轻微 overshoot；
     遮罩改 visibility+opacity 淡入淡出（display 切换会杀死过渡） */
  :root{--fr-ease:cubic-bezier(.22,1,.36,1);--fr-pop:cubic-bezier(.34,1.56,.64,1)}

  #mask{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);z-index:10;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s var(--fr-ease),visibility 0s linear .22s}

  /* ★ 快速点击防误选（2026-11-15）：chrome 不可选；聊天正文与组编号/标题保留选词 */
  header,footer,.composer .bar,button,.switch,.chip,.inst-badge,#modelMenu,#frModeMenu,#permQuickMenu,#permMenu,.gm-head,.gm-new,.gm-foot,.gm-row,#drawer .dh{-webkit-user-select:none;user-select:none}

  #frTip{position:fixed;left:0;top:0;z-index:95;max-width:264px;padding:7px 11px;background:linear-gradient(180deg, color-mix(in srgb, #ffffff 8%, transparent), transparent 46%), color-mix(in srgb, var(--panel-fill) 42%, transparent);border:1px solid var(--tint-line);border-radius:10px;font:12px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);box-shadow:inset 0 1px 0 color-mix(in srgb, #ffffff 12%, transparent), 0 6px 20px rgba(0,0,0,.22);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);pointer-events:none;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .14s var(--fr-ease),transform .14s var(--fr-ease);white-space:normal;word-break:break-word}
  :root[data-fr-theme="light"] #frTip{background:linear-gradient(180deg, color-mix(in srgb, #ffffff 70%, transparent), transparent 46%), color-mix(in srgb, #ffffff 55%, transparent);box-shadow:inset 0 1px 0 #ffffff, 0 6px 18px rgba(15,23,42,.12)}
  #frTip.show{opacity:1;transform:none}
  #frTip::after{content:"";position:absolute;left:var(--ax,50%);top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--fr-tip-arrow)}

  /* 会话组管理弹层 */
  #groupsModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(820px,94vw);height:auto;max-height:min(76vh,780px);min-height:240px;container-type:inline-size;container-name:gm;background:var(--surface-popup);border:0;border-radius:var(--dsw-radius-xl);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);box-shadow:var(--elev-popup);display:none;flex-direction:column;z-index:25;overflow:hidden}
  /* ★ 2026-11-10：fixed 元素的 backdrop-filter 在 Chromium 对 transform 祖先采样会失效，

  /* ── 极窄窗口适配（DSH 侧栏拖到最窄时；按容器宽度逐级降级） ───────────── */
  @media (max-width: 560px){
    header{padding:0 10px;gap:6px;height:auto;min-height:26px;flex-wrap:nowrap;overflow:hidden}

    header button.icon{padding:0 6px;height:20px;min-height:20px;font-size:13px}
    .empty-title{font-size:28px;letter-spacing:8px;padding-left:8px;line-height:1.35;transform:none;white-space:nowrap}

    .composer{padding:10px 10px 6px}

  /* ── 极窄：模式按钮可见性保障（2026-10-24）─────────────────────────── */

  /* ── 技术面板 UI 优化（2026-10-24）────────────────────────────────── */
  #drawer .dh{padding:12px 16px;background:var(--tint-weak)}

        document.documentElement.style.setProperty('--fg','#000000');
        document.documentElement.style.setProperty('--fg2','#3f3f46');
        document.documentElement.style.setProperty('--muted','#52525b');
        changed=true;
      }
      // ★ 面板底色 = DSH 会话区实底色（实测 rgb(21,21,23)=#151517 深灰，
      //   近黑 bg-base 在灰色侧边栏衬托下对比过强——用户反馈改深灰）
      try{
        var col=src.document.querySelector('[class*="centerCol"]');
        if(col){
          var bg=src.getComputedStyle(col).backgroundColor;
          if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')document.documentElement.style.setProperty('--panel-fill',bg);
        }
      }catch(e){}
      return changed;
    }catch(e){return false}
  }
  window.addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.fr==='uiTheme'){ try{localStorage.setItem('fr-uiTheme',d.value)}catch(e){} if(window.__FR_CFG)window.__FR_CFG.uiTheme=d.value; sync(); }
  });
  sync();
  try{ var mq0=window.matchMedia('(prefers-color-scheme: light)'); if(mq0&&mq0.addEventListener) mq0.addEventListener('change',sync); }catch(e){}
  // ★ 2026-11-10 修复：__frTimer 定义在 <body> 末尾脚本里，head 这里还拿不到。
  //   以前直接调用会抛 "window.__frTimer is not a function"，把本脚本块打断。
  //   改为：有就用统一调度器，没有就先退回 setInterval（定义好后不影响效果）。
  (function(){
    function arm(){
      if (typeof window.__frTimer === 'function') { window.__frTimer(3000, sync); return true }
      return false
    }
    if (!arm()) {
      var iv = setInterval(function(){ if (arm()) clearInterval(iv) }, 200);
      setTimeout(function(){ clearInterval(iv) }, 5000); // 5s 兜底
    }
  })();
  window.addEventListener('focus',sync);
})();
</script>
</head>
<body>
<script>
/* ── 统一轮询调度器（2026-11-07）：把页面里分散的 setInterval 收成一个 1s 心跳 ──
   · 只保留一个定时器，避免多个 setInterval 各自扎堆触发（同一瞬间读同一批文件）
   · 页面隐藏时整体暂停（document.hidden），标签页在后台不再空转 */
window.__frTimer = (function(){
  // 开关：window.__FR_CFG.pollUnified === false ⇒ 退回各模块自己的 setInterval（对照组）
  if (window.__FR_CFG && window.__FR_CFG.pollUnified === false) {
    return function(ms, fn){ setInterval(fn, ms); };
  }
  var jobs = [];
  var last = 0;
  setInterval(function(){
    if (document.hidden) return;
    var n = Date.now();
    last = n;
    for (var i = 0; i < jobs.length; i++) {
      var j = jobs[i];
      if (n - j.at >= j.ms) { j.at = n; try { j.fn() } catch (e) { /* 单个任务失败不影响其它 */ } }
    }
  }, 1000);
  return function(ms, fn){ jobs.push({ ms: ms, fn: fn, at: 0 }); };
})();
</script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id) }
  var EMBED = /(\?|&)embed=1/.test(location.search)
  if (EMBED) document.body.classList.add('embed')
  var lastChatKey = '', lastCount = 0

  // ── 全局报错展示（不吞错）─────────────────────────────────────────────
  var _errSeen = {}
  function showErr(kind, msg, extra){
    try {
      var key = kind + '|' + msg
      if (_errSeen[key]) return             // 同样的错只报一次，避免刷屏
      _errSeen[key] = 1
      var bar = $('errBar'), txt = $('errTxt')
      if (!bar || !txt) return
      var line = '[' + new Date().toLocaleTimeString() + '] ' + kind + ': ' + msg
      if (extra) line += '\n' + extra
      var wasHidden = !bar.classList.contains('show')
      var atBottom = (txt.scrollHeight - txt.scrollTop - txt.clientHeight) < 24
      txt.textContent = (txt.textContent ? txt.textContent + '\n' : '') + line
      bar.classList.add('show')
      // 日志式滚动：隐藏后重新弹出回到顶部；可见期间追加新错时，只在原本贴底才跟随到底
      if (wasHidden) txt.scrollTop = 0
      else if (atBottom) txt.scrollTop = txt.scrollHeight
      try { console.error('[快速反应]', kind, msg, extra || '') } catch (e) {}
    } catch (e) {}
  }
  window.addEventListener('error', function(e){
    showErr('JS 错误', (e && e.message) || '未知错误', (e && e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : ''))
  })
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason
    showErr('未处理的 Promise', (r && (r.message || r)) || '未知', (r && r.stack ? String(r.stack).split('\n').slice(0, 3).join('\n') : ''))
  })

  function toast(msg, isErr){
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '')
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast' }, 2600)
  }
  function api(path, opts){
    var url = (window.__FR_BASE || '/fr') + '/api' + path
    return fetch(url, Object.assign({ headers:{ 'content-type':'application/json' }, credentials:'same-origin' }, opts||{}))
      .then(function(r){
        return r.text().then(function(txt){
          var j = null
          try { j = txt ? JSON.parse(txt) : {} } catch (e) {
            // 非 JSON（多半是 500 崩溃页或代理错误）→ 把原文截断展示
            throw new Error('HTTP ' + r.status + ' ' + (r.statusText || '') + ' · 响应不是 JSON: ' + String(txt || '').slice(0, 300))
          }
          if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status + ' ' + (r.statusText || '')))
          return j || {}
        })
      })
      .catch(function(err){
        // 网络层失败（服务未起 / fetch failed）也统一带上网址
        if (err && err.name === 'TypeError') throw new Error('请求失败 ' + url + '：' + (err.message || '网络错误'))
        throw err
      })
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c] }) }
  function fmtMs(ms){ return ms==null ? '—' : (ms<1000 ? Math.round(ms)+'ms' : (ms/1000).toFixed(1)+'s') }
  function fmtK(n){ return n==null ? '—' : (n>=1000 ? (n/1000).toFixed(1)+'k' : String(n)) }
  function tOf(s){ s = String(s||''); return s.length > 19 ? s.slice(11,19) : s }

  // 系统注入话术（防御性兜底：服务端已过滤一遍）
  var SYS_RE = /^(【快速反应|<system-reminder|Current runtime context|Time sampled while|本环境装有|You are an AI agent|This is an automatically generated)/

  // 后台内部话术（分诊/判定/verdict）不该出现在用户视野
  var BACK_INTERNAL_RE = /^(判定：|判定:|已写\s*verdict|已更新\s*verdict|无需调整|short:\s*)/

  function renderChat(d){
    var chat = d.chat || {}
    var rows = []
    // ★ 不标人：只有两个角色（用户 / Agent），用户靠右浅灰气泡，Agent 左侧纯文本
    ;(chat.front || []).forEach(function(m){
      if (m.role === 'notice') { rows.push({ m:m, cls:'notice' }); return }
      if (m.role !== 'user' && m.role !== 'agent') return
      if (m.role === 'user' && (SYS_RE.test(String(m.text||'')) || /<system-reminder>/.test(String(m.text||'')))) return
      // 后台分诊话术可能被投进前台，同样隐藏（用户实测：不该看到"判定：无需调整，已写 verdict.md"）
      if (m.role === 'agent' && BACK_INTERNAL_RE.test(String(m.text||''))) return
      rows.push({ m:m, cls: m.role === 'user' ? 'me' : '' })
    })
    // ★ 不再渲染 chat.back：后台是内部角色，它的「判定/verdict」不是用户消息；
    //   之前混进来还会因为没有 at 时间戳被排到最底部（用户实测顺序错乱）。
    rows.sort(function(a,b){
      var ta = Date.parse(String(a.m.at || '')), tb = Date.parse(String(b.m.at || ''))
      if (!isNaN(ta) && !isNaN(tb) && ta !== tb) return ta - tb
      return 0   // 时间不可比时保持原有顺序（稳定排序）
    })
    var running = !!(d.front && d.front.phase === 'running')
    // ★ 2026-11-10：抽屉关着时跳过技术面板重绘（progBox/steps/events 全量 innerHTML，用户看不见纯浪费）
    var tail = rows.length ? rows[rows.length-1].m : null
    var key = rows.length + '|' + (tail ? String(tail.at) + String(tail.text).slice(0,40) + '|' + String(tail.think || '').length : '') + '|' + (running ? 'R' : '')
    if (key === lastChatKey) return   // 内容没变 → 不重建 DOM（滚动位置不丢）
    lastChatKey = key
    var box = $('chat')
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80
    var typing = running ? '<div class="msg typing"><span class="dots"><i></i><i></i><i></i></span>前台正在处理…</div>' : ''
    if (!rows.length){
      box.innerHTML = typing || '<div class="empty"><div class="empty-title">随叫随到</div></div>'
      if (atBottom) box.scrollTop = box.scrollHeight
      return
    }
    // 用会话里的用户消息填充 ↑ 历史（刷新后也能调出上一条）
    try {
      var us = rows.filter(function(r){ return r.m.role === 'user' }).map(function(r){ return String(r.m.text || '') }).filter(Boolean)
      if (us.length > sentHistory.length) sentHistory = us.slice(-30)
    } catch (err) {}
    box.innerHTML = rows.map(function(r){
      if (r.cls === 'notice') return '<div class="notice">'+esc(r.m.text)+'</div>'
      // 思考过程：浅灰折叠块（仅 Agent 回复，默认收起）
      var think = (r.m.role === 'agent' && r.m.think) ? '<details class="think"><summary>思考过程</summary><div class="tt">'+esc(r.m.think)+'</div></details>' : ''
      return '<div class="msg '+r.cls+'"><div class="bubble">'+think+'<div class="txt">'+esc(r.m.text)+'</div><button class="copy" title="复制这条消息">复制</button></div></div>'
    }).join('') + typing
    if (atBottom) box.scrollTop = box.scrollHeight
  }

  function renderTech(d){
    if (!$('drawer').classList.contains('open')) return   // ★ 关闭时不重绘
    var done = (d.state && d.state.done) || 'S0'
    var total = (d.steps && d.steps.length) || 0
    var doneNo = parseInt(String(done).replace(/\D/g,''),10) || 0
    var pct = total ? Math.min(100, Math.round(doneNo/total*100)) : 0
    $('progBox').innerHTML =
      '<span class="k">状态</span><span class="v">'+esc((d.state&&d.state.status)||'—')+'</span>' +
      '<span class="k">进度</span><span class="v">'+doneNo+' / '+total+'（'+pct+'%）</span>'
    var sl = []
    ;(d.steps||[]).forEach(function(f){
      var n = parseInt(String(f).replace(/\D/g,''),10)
      var cls = n <= doneNo ? 'done' : (n === doneNo+1 ? 'cur' : 'todo')
      sl.push('<span class="st '+cls+'">'+esc(String(f).replace('.md',''))+'</span>')
    })
    $('steps').innerHTML = sl.join('') || '<span style="color:var(--muted);font-size:12px">无步骤</span>'

    var ms = d.milestones || 0
    var okLoop = ms > 0 && ms === total
    $('loopBox').innerHTML =
      '<span class="k">里程碑</span><span class="v">'+ms+'</span>' +
      '<span class="k">步骤</span><span class="v">'+total+'</span>' +
      '<span class="k">一致性</span><span class="v '+(okLoop?'ok':(ms?'warn':''))+'">'+(okLoop?'✓ 对齐':(ms?'⚠ 不一致':'—'))+'</span>' +
      '<span class="k">route</span><span class="v">'+(d.routeRendered?'fr_route':'手写')+' · '+fmtK(d.routeSize)+'字</span>' +
      '<span class="k">哨兵</span><span class="v">'+(d.renderedSn==null?'—':d.renderedSn)+'</span>'

    var ff = d.firstFrameMs
    $('metrics').innerHTML =
      '<span class="k">首帧</span><span class="v '+(ff!=null&&ff<15000?'ok':(ff?'warn':''))+'">'+fmtMs(ff)+'</span>' +
      '<span class="k">投递</span><span class="v ok">'+fmtMs(d.lastWatchMs)+'</span>' +
      '<span class="k">前台上下文</span><span class="v">'+fmtK(d.ctx&&d.ctx.front)+' / '+fmtK(d.limits&&d.limits.front)+'</span>' +
      '<span class="k">后台上下文</span><span class="v">'+fmtK(d.ctx&&d.ctx.back)+' / '+fmtK(d.limits&&d.limits.back)+'</span>' +
      '<span class="k">最近压缩</span><span class="v">'+(d.lastCompact?(fmtK(d.lastCompact.before)+'→'+fmtK(d.lastCompact.after)):'—')+'</span>'

    var wb = d.wakeBy||{}, wl=[]
    Object.keys(wb).forEach(function(k){ wl.push('<span class="k">'+esc(k)+'</span><span class="v">'+wb[k]+'</span>') })
    $('wakes').innerHTML = wl.join('') || '<span class="k">—</span><span class="v">0</span>'

    var t = d.tools||{}
    $('counters').innerHTML =
      '<span class="k">工具</span><span class="v">'+(t.total||0)+'</span>' +
      '<span class="k">失败</span><span class="v '+(t.failTotal?'warn':'')+'">'+(t.failTotal||0)+'</span>' +
      '<span class="k">T3</span><span class="v">'+(d.t3Blocked||0)+'</span>'

    var ev = []
    ;(d.recent||[]).slice().reverse().forEach(function(x){
      var det = ''; try { det = x.detail ? JSON.stringify(x.detail) : '' } catch(e){}
      if (det.length > 70) det = det.slice(0,70)+'…'
      var hot = /freeze|route-rendered|escalate|interrupt|step-delivered|watcher-fire|api-task/.test(x.kind||'')
      ev.push('<div class="ev'+(hot?' hot':'')+'"><span class="t">'+esc(tOf(x.at))+'</span> <b>'+esc(x.kind)+'</b> '+esc(det)+'</div>')
    })
    $('events').innerHTML = ev.join('') || '<span style="color:var(--muted);font-size:12px">暂无</span>'

    if (!renderTech._cfg){

    function toggle(f){ open = typeof f === 'boolean' ? f : !open; if (open && window.__frCloseOtherMenus) window.__frCloseOtherMenus('perm'); menu.classList[open ? 'add' : 'remove']('show'); if (open) { try { cur = localStorage.getItem('fr_perm') || cur } catch (e) {} refresh() } }
    document.addEventListener('fr:menu-others-open', function(ev){
      if (ev && ev.detail && ev.detail.keep === 'perm') return
      if (open) { open = false; try { menu.classList.remove('show') } catch (e) {} }
    })
    document.addEventListener('fr:menu-others-open', function(ev){
      if (ev && ev.detail && ev.detail.keep === 'perm') return
      if (open) { open = false; try { menu.classList.remove('show') } catch (e) {} }
    })
    btn.onclick = function(e){ e.stopPropagation(); toggle() }
    menu.onclick = function(e){
      var op = e.target && e.target.closest ? e.target.closest('.op') : null
      if (!op) return
      var preset = op.getAttribute('data-p') || ''
      // 通过 groups/policy 应用到当前活跃组；没有组则写全局默认
      fetch(window.__FR_BASE + '/api/groups').then(function(r){ return r.json() }).then(function(j){
        var active = (j.groups || []).filter(function(g){ return g.active })[0]
        if (active) {
          return fetch(window.__FR_BASE + '/api/groups', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'policy', key: active.key, preset: preset }) })
        }
        return fetch(window.__FR_BASE + '/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ permissionPreset: preset }) })
      }).then(function(){
        cur = preset                       // ★ 立即记住，高亮马上跟上
        try { localStorage.setItem('fr_perm', preset) } catch (e) {}
        render()
        toast('权限已设为 ' + (preset || '跟随 DSH'))
        toggle(false); load()
      })
        .catch(function(){ toast('设置权限失败', true) })
    }
    document.addEventListener('click', function(e){
      var t = e.target; if (!t || !t.closest) return
      if (open && !t.closest('#permQuickMenu') && !t.closest('#btnPerm')) toggle(false)
    })
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && open) toggle(false) })
    function refresh(){
      fetch(window.__FR_BASE + '/api/status').then(function(r){ return r.json() }).then(function(j){
        var p = j.permissions || {}
        cur = p.front || p.default || ''
        render()
      }).catch(function(){})
    }
    refresh(); window.__frTimer(15000, refresh)
  })();

  // ── 三个下拉菜单互斥：打开一个就广播让其它关掉自己 ────────────────
  window.__frCloseOtherMenus = function(keep){
    try { document.dispatchEvent(new CustomEvent('fr:menu-others-open', { detail: { keep: keep } })) } catch (e) {}
  }

  // ── T3 待批准卡片（每 2 秒拉一次）────────────────────────────────────
  function renderT3(){
    fetch(window.__FR_BASE + '/api/confirm', { cache: 'no-store' }).then(function(r){ return r.json() }).then(function(j){
      var box = document.getElementById('t3Box'); if (!box) return
      var list = (j && j.pending) || []
      if (!list.length){ box.style.display = 'none'; box.innerHTML = ''; return }
      box.style.display = 'block'
      box.innerHTML = list.map(function(it){
        return '<div style="padding:10px 12px;background:rgba(200,140,40,.12);border:1px solid rgba(230,170,60,.6);border-radius:10px;color:#f0d090;font:12px/1.6 ui-monospace,Consolas,monospace">' +
          '<div style="font-weight:600;margin-bottom:6px;color:#ffd88a">⚠ 需要你批准的危险操作（' + it.id + '）</div>' +
          '<div style="white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;margin-bottom:8px">' + esc(it.cmd) + '</div>' +
          '<div style="display:flex;gap:8px">' +
          '<button data-t3="ok" data-step="' + esc(it.id) + '" style="padding:5px 14px;border-radius:8px;border:1px solid rgba(120,220,120,.6);background:rgba(60,180,80,.2);color:#9df0a9;cursor:pointer;font-size:12px">允许执行</button>' +
          '<button data-t3="no" data-step="' + esc(it.id) + '" style="padding:5px 14px;border-radius:8px;border:1px solid rgba(220,120,120,.6);background:rgba(180,60,60,.2);color:color-mix(in srgb, var(--err) 80%, var(--fg));cursor:pointer;font-size:12px">拒绝</button>' +
          '</div></div>'
      }).join('')
    }).catch(function(){})
  }
  document.addEventListener('click', function(e){
    var t = e.target; if (!t || !t.dataset || !t.dataset.t3) return
    var step = t.dataset.step, action = t.dataset.t3 === 'ok' ? 'approve' : 'reject'
    fetch(window.__FR_BASE + '/api/confirm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: action, step: step }) })
      .then(function(){ toast(action === 'approve' ? '已批准，前台可继续' : '已拒绝'); renderT3(); load() })
      .catch(function(){ toast('操作失败', true) })
  })
  renderT3(); window.__frTimer(3000, renderT3)  /* T3 从 2s → 3s，与心跳对齐 */
  load().then(nextPoll, nextPoll)
})();
</script>
<script>
// 模式选择器（2026-10-24：与「切换模型」同款按钮 + 弹出菜单；悬停 0.6s 显示简介）
(function(){
var fallback={quick:["速答","不编排：前台直接答，最多查一眼"],consult:["咨询","深度分析：后台可查资料，只产出 analysis.md，不写步骤"],retrieval:["检索","长检索：前台自己并行查，不惊动后台"],coding:["编码","标准编排：后台写路线+步骤，前台执行"]};
var btn=document.getElementById("btnMode"),menu=document.getElementById("frModeMenu"),label=document.getElementById("frModeLabel"),mark=document.getElementById("frModeLockMark");
if(!btn||!menu)return;
var info={},cur="",locked=false,open=false,hoverTimer=null;
for(var k in fallback) info[k]={label:fallback[k][0],summary:fallback[k][1]};
var tip=document.createElement("div");tip.id="frModeTip";document.body.appendChild(tip);
function api(p,o){return fetch(p,o).then(function(r){return r.json()})}
function render(){
  var h='<div class="grp">任务模式</div>';
  for(var k in info){h+='<div class="op'+(k===cur?" cur":"")+'" data-k="'+k+'" data-tip="'+info[k].summary.replace(/"/g,"&quot;")+'">'+info[k].label+'<span class="badge">'+k+'</span></div>'}
  h+='<div class="grp">锁定（禁止自动判型）</div><div class="op" data-lock="1">'+(locked?"🔒 已锁定（点击解锁）":"🔓 未锁定（点击锁定）")+'</div>';
  menu.innerHTML=h;
  label.textContent=(info[cur]&&info[cur].label)||"模式";
  mark.textContent=locked?"🔒":"";
}
function hideTip(){tip.style.display="none"}
function showTip(op){
  var txt=op&&op.dataset&&op.dataset.tip;
  if(!txt)return;
  tip.textContent=txt;tip.style.display="block";
  var r=op.getBoundingClientRect();
  var w=tip.offsetWidth,h=tip.offsetHeight;
  var left=Math.max(8,Math.min(r.left,window.innerWidth-w-8));
  var top=r.top-h-8;
  if(top<8)top=r.bottom+8;
  tip.style.left=left+"px";tip.style.top=top+"px";
}
function armTip(e){
  var op=e.target&&e.target.closest?e.target.closest(".op[data-tip]"):null;
  clearTimeout(hoverTimer);hideTip();
  if(!op)return;
  hoverTimer=setTimeout(function(){showTip(op)},600);
}
function toggle(f){open=typeof f==="boolean"?f:!open;if(open&&window.__frCloseOtherMenus)window.__frCloseOtherMenus("mode");menu.classList[open?"add":"remove"]("show");if(open)render();else{clearTimeout(hoverTimer);hideTip()}}
document.addEventListener("fr:menu-others-open",function(ev){if(ev&&ev.detail&&ev.detail.keep==="mode")return;if(open){open=false;menu.classList.remove("show");clearTimeout(hoverTimer);hideTip()}});
document.addEventListener("fr:menu-others-open",function(ev){if(ev&&ev.detail&&ev.detail.keep==="mode")return;if(open){open=false;menu.classList.remove("show");clearTimeout(hoverTimer);hideTip()}});
btn.onclick=function(e){e.stopPropagation();toggle()};
menu.addEventListener("mouseover",armTip);
menu.addEventListener("mouseout",function(){clearTimeout(hoverTimer);hideTip()});
menu.onclick=function(e){
  var op=e.target&&e.target.closest?e.target.closest(".op"):null;
  if(!op)return;
  if(op.dataset.lock){locked=!locked;api("/fr/api/mode",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({locked:locked})}).then(function(){render();try{load()}catch(_){}});return}
  if(!op.dataset.k)return;
  api("/fr/api/mode",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:op.dataset.k})}).then(function(){cur=op.dataset.k;render();toggle(false);try{load()}catch(_){}});
};
document.addEventListener("click",function(e){var t=e.target;if(!t||!t.closest)return;if(open&&!t.closest("#frModeMenu")&&!t.closest("#btnMode"))toggle(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&open)toggle(false)});
function refresh(){api("/fr/api/mode").then(function(j){
  if(j&&j.presetsInfo&&j.presetsInfo.length){info={};for(var i=0;i<j.presetsInfo.length;i++){var p=j.presetsInfo[i];info[p.key]={label:p.label,summary:p.summary}}}
  cur=(j&&j.mode)||"coding";locked=!!(j&&j.locked);render();
})}
refresh();window.__frTimer(15000, refresh);
})();
</script>

<script>
/* ★ 快速点击防误选 + 悬停气泡提示（2026-11-15）
   · 防误选只靠 CSS user-select:none（chrome/按钮）；不用 mousedown 拦截——
     那会连正文双击选词一起杀掉（实测抽屉 kv 选不中）
   · [data-tip] 委托气泡：600ms 延迟（2026-11-15 调长，扫过不误弹）、出界翻转、水平 clamp、键盘聚焦也出；
     点击/滚动/Esc 收起；触摸后 700ms 内不弹（防点按残留） */
(function(){
  var tip = document.createElement('div');
  tip.id = 'frTip'; tip.setAttribute('role','tooltip'); tip.style.display = 'none';
  document.body.appendChild(tip);
  var cur = null, timer = null, hideT = null, touchTs = 0;
  document.addEventListener('touchstart', function(){ touchTs = Date.now(); }, {passive:true});
  function place(el){
    var r = el.getBoundingClientRect();
    tip.style.display = 'block';
    tip.classList.remove('show','below');
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = Math.max(8, Math.min(r.left + r.width/2 - tw/2, innerWidth - tw - 8));
    var y = r.top - th - 9, below = false;
    if (y < 8){ y = r.bottom + 9; below = true; }
    if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
    tip.classList.toggle('below', below);
    tip.style.setProperty('--ax', Math.max(12, Math.min(r.left + r.width/2 - x, tw - 12)) + 'px');
    requestAnimationFrame(function(){ tip.classList.add('show'); });
  }
  function show(el){
    var text = el.getAttribute('data-tip');
    if (!text) return;
    clearTimeout(hideT); cur = el; tip.textContent = text; place(el);
  }
  function hide(){
    clearTimeout(timer); timer = null; cur = null;
    tip.classList.remove('show');
    clearTimeout(hideT); hideT = setTimeout(function(){ if (!cur) tip.style.display = 'none'; }, 160);
  }
  document.addEventListener('mouseover', function(e){
    if (Date.now() - touchTs < 700) return;
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el || el === cur) return;
    clearTimeout(timer);
    timer = setTimeout(function(){ show(el); }, 600);
  });
  document.addEventListener('mouseout', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!el) return;
    if (e.relatedTarget && el.contains(e.relatedTarget)) return;
    clearTimeout(timer); timer = null;
    if (cur === el) hide();
  });
  document.addEventListener('mousedown', function(){ hide(); }, true);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') hide(); });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
  document.addEventListener('focusin', function(e){
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (el) show(el);
  });
  document.addEventListener('focusout', function(){ hide(); });
})();
</script>
