<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>随叫随到</title>
<style>
  :root{
    /* ══ DSH 官方主题 token（--dsw-alias-*）：同源 iframe 内由底部脚本从父页面
       实时同步真实值；独立打开（无父页）时用下面的 fallback，色值与 DSH 暗色一致 ══ */
    --dsw-alias-bg-base:#0d1117;
    --dsw-alias-bg-layer-1:#161b22;
    --dsw-alias-bg-layer-2:#1c2128;
    --dsw-alias-bg-overlay:#1c2128;
    --dsw-alias-border-l1:#30363d;
    --dsw-alias-border-l2:#3d444d;
    --dsw-alias-brand-primary:#1f6feb;
    --dsw-alias-label-primary:#e6edf3;
    --dsw-alias-label-secondary:#8b949e;
    --dsw-alias-state-success-primary:#3fb950;
    --dsw-alias-state-warn-primary:#d29922;
    --dsw-alias-state-error-primary:#f85149;
    --dsw-alias-state-idle-primary:#6e7681;

    /* 语义别名：全站颜色都走这两个来源（同步后的 dsw 值优先） */
    --bg:var(--dsw-alias-bg-base); --bg2:var(--dsw-alias-bg-layer-1); --bg3:var(--dsw-alias-bg-layer-2);
    --line:var(--dsw-alias-border-l1); --line2:var(--dsw-alias-border-l2);
    --fg:var(--dsw-alias-label-primary); --fg2:var(--dsw-alias-label-secondary); --muted:var(--dsw-alias-state-idle-primary);
    --accent:var(--dsw-alias-brand-primary);
    --ok:var(--dsw-alias-state-success-primary); --warn:var(--dsw-alias-state-warn-primary); --err:var(--dsw-alias-state-error-primary);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--panel-fill,var(--bg));color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* 极简顶栏：无底色填充，只保留底部一条对齐的分割线 */
  /* 顶栏 = DSH 页签行同款（实测：26px 高、灰线 1px rgba(255,255,255,.16)、
     左起点 x=284 = padding 20；chrome bar 占上方 50px 对应 DSH titleRow） */
  header{display:flex;align-items:center;gap:10px;height:26px;box-sizing:border-box;padding:0 20px;background:transparent;border-bottom:1px solid rgba(255,255,255,.16);flex:0 0 auto;overflow:hidden;white-space:nowrap}
  header .chips{display:flex;gap:6px;flex:0 0 auto}
  header .chip{padding:1px 8px;font-size:11px;border-radius:999px}
  header button{padding:2px 10px;font-size:12px;border-radius:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .dot.on{background:var(--ok);box-shadow:0 0 7px var(--ok)}
  .dot.busy{background:var(--warn);box-shadow:0 0 7px var(--warn);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .title{font-weight:500;font-size:13px;letter-spacing:.2px;color:var(--fg2);display:none} /* 标题在 chrome bar，避免重复 */
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:2px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:11.5px;color:var(--fg2);white-space:nowrap}
  .chip b{color:var(--fg);font-weight:600}
  .grow{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:6px 12px;border-radius:8px;font-size:12.5px;font-family:inherit;transition:.14s}
  button:hover:not(:disabled){border-color:var(--line2);background:var(--bg-overlay,var(--bg3))}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){filter:brightness(1.12)}
  button.ghost{background:transparent}
  button.icon{padding:0 9px;font-size:14px;line-height:1;height:22px;min-height:22px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}

  main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
  #chat{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:20px 22px 8px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:1040px;margin:0 auto}
  /* ★ 2026-10-24：滑条不再突兀——固定占位（scrollbar-gutter）避免内容跳动；
     细滑条 + 半透明，悬停聊天区才加深；Firefox 用 scrollbar-width/color */
  #chat{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
  #chat:hover{scrollbar-color:rgba(255,255,255,.3) transparent}
  #chat::-webkit-scrollbar{width:10px;height:10px}
  #chat::-webkit-scrollbar-track{background:transparent}
  #chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:6px;border:2px solid transparent;background-clip:content-box;transition:background .18s ease}
  #chat:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.26);background-clip:content-box}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:520px;line-height:2}
  .empty-title{font-size:40px;font-weight:600;letter-spacing:20px;padding-left:20px;color:var(--fg2);opacity:.92;line-height:1.4;transform:translateY(-4%)}
  .empty b{color:var(--fg2);display:block;margin-bottom:10px;font-size:16px}
  .empty code{background:var(--bg3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font:12px var(--mono);color:#d2a8ff}

  /* 消息：DSH 同款 —— 不标人（只有两个角色），用户=浅灰气泡右对齐，Agent=纯文本左侧 */
  .msg{display:flex;max-width:min(92%,900px)}
  .msg.me{align-self:flex-end}
  .avatar{display:none}
  .bubble{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bubble .who{display:none}
  .bubble .txt{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.7;color:var(--fg)}
  .msg.me .bubble .txt{background:rgb(44,44,46);border-radius:18px;padding:10px 16px}
  .msg:not(.me) .bubble .txt{background:transparent;padding:0 2px}
  /* 思考过程：浅灰折叠块（默认收起，点开看推理） */
  .think{margin:0 0 8px}
  .think summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:999px;padding:4px 12px;user-select:none}
  .think summary::-webkit-details-marker{display:none}
  .think summary::before{content:'▸';font-size:10px;opacity:.8;transition:transform .15s}
  .think[open] summary::before{transform:rotate(90deg)}
  .think summary:hover{color:var(--fg2);background:rgba(255,255,255,.075)}
  .think .tt{margin-top:7px;padding:9px 13px;background:rgba(255,255,255,.035);border-left:2px solid rgba(255,255,255,.12);border-radius:0 10px 10px 0;color:var(--muted);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
  /* 运行指示：前台在跑时必须有反馈，否则看起来像死了 */
  .msg.typing{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;padding:2px 4px}
  .dots{display:inline-flex;gap:3px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--fg2);display:block;animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}
  .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.22;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  /* 可操作通知（T3 确认 / 哨兵 / 上交）：必须显眼，否则用户看不到卡点 */
  .notice{align-self:center;max-width:86%;font-size:12.5px;line-height:1.65;color:#e3c07b;background:rgba(227,192,123,.07);border:1px solid rgba(227,192,123,.28);border-radius:10px;padding:7px 13px;white-space:pre-wrap;word-break:break-word}
  /* 便捷功能：快捷模板 / 悬停复制 */
  .copy{position:absolute;top:-9px;right:8px;opacity:0;pointer-events:none;cursor:pointer;font-size:11px;color:var(--fg2);background:#2c2c2e;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:2px 9px;transition:.12s;font-family:inherit}
  .msg .bubble{position:relative}
  .msg:hover .copy{opacity:1;pointer-events:auto}
  .copy:hover{color:var(--fg);border-color:rgba(255,255,255,.28)}
  /* 发送即打断开关（胶囊式 toggle） */
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:4px 10px 4px 4px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:transparent;transition:.15s}
  .switch:hover{background:rgba(255,255,255,.06)}
  .switch input{display:none}
  .switch .slider{position:relative;width:30px;height:17px;border-radius:999px;background:rgba(255,255,255,.16);transition:.15s;flex:0 0 auto}
  .switch .slider::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#d8dde3;transition:.15s}
  .switch .sw-lbl{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .switch input:checked + .slider{background:#c2453d}
  .switch input:checked + .slider::after{transform:translateX(13px);background:#fff}
  .switch input:checked ~ .sw-lbl{color:#e88b84}

  footer{flex:0 0 auto;padding:10px 18px 16px;background:transparent}
  /* DSH 同款输入栏（实测：bg rgb(44,44,46) 浅灰 / 圆角 28 / 无边框 / 无投影） */
  .composer{position:relative;display:flex;flex-direction:column;gap:9px;background:rgb(44,44,46);border:0;border-radius:28px;padding:16px 18px 10px;transition:.15s;width:100%;max-width:1040px;margin:0 auto}
  .composer:focus-within{outline:none}
  .composer textarea{width:100%;min-height:52px;max-height:210px;resize:none;background:transparent;color:var(--fg);border:0;outline:none;font:14.5px/1.6 inherit;padding:2px 4px}
  .composer textarea::placeholder{color:var(--muted)}
  .composer .bar{display:flex;align-items:center;gap:8px}
  .composer .bar .hint{font-size:11.5px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:5px 12px;white-space:nowrap}
  /* 胶囊按钮（DSH 权限胶囊同款：透明底 + 细描边） */
  .composer .pill{background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--fg2);border-radius:999px;padding:6px 14px;font-size:12.5px}
  .composer .pill:hover{background:rgba(255,255,255,.06);color:var(--fg);border-color:rgba(255,255,255,.22)}
  /* 模型切换器：DSH 同位置（输入栏右下、发送键左侧），透明底 8px 圆角 28px 高 */
  #btnModel,#btnMode,#btnPerm{display:flex;align-items:center;gap:5px;height:28px;padding:0 9px;background:transparent;border:0;border-radius:8px;color:var(--fg2);font-size:13px;cursor:pointer;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #btnModel:hover,#btnMode:hover,#btnPerm:hover{background:rgba(255,255,255,.07);color:var(--fg)}
  #btnModel .caret,#btnMode .caret,#btnPerm .caret{font-size:10px;opacity:.7}
  #modelMenu,#frModeMenu{position:absolute;right:56px;bottom:56px;min-width:260px;max-height:320px;overflow:auto;background:#2c2c2e;border:0;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none;z-index:30}
  #modelMenu.show,#frModeMenu.show{display:block}
  #permQuickMenu{position:absolute;right:56px;bottom:56px;min-width:220px;max-height:300px;overflow:auto;background:#2c2c2e;border:0;border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:none;z-index:30}
  #permQuickMenu.show{display:block}
  /* 三个下拉菜单统一细滚动条（与聊天区一致，避免突兀系统粗条） */
  #modelMenu::-webkit-scrollbar,#frModeMenu::-webkit-scrollbar,#permQuickMenu::-webkit-scrollbar{width:8px}
  #modelMenu::-webkit-scrollbar-track,#frModeMenu::-webkit-scrollbar-track,#permQuickMenu::-webkit-scrollbar-track{background:transparent}
  #modelMenu::-webkit-scrollbar-thumb,#frModeMenu::-webkit-scrollbar-thumb,#permQuickMenu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:5px;border:2px solid transparent;background-clip:content-box}
  #modelMenu:hover::-webkit-scrollbar-thumb,#frModeMenu:hover::-webkit-scrollbar-thumb,#permQuickMenu:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.24);background-clip:content-box}
  #modelMenu,#frModeMenu,#permQuickMenu{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
  #permQuickMenu .grp{padding:6px 10px 3px;font-size:11px;color:var(--muted);letter-spacing:.3px}
  #permQuickMenu .op{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
  #permQuickMenu .op:hover{background:rgba(255,255,255,.08)}
  #permQuickMenu .op.cur{color:#7aaaff;background:rgba(122,170,255,.15)}
  #modelMenu .grp,#frModeMenu .grp{padding:6px 10px 3px;font-size:11px;color:var(--muted);letter-spacing:.3px}
  #modelMenu .op,#frModeMenu .op{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
  #modelMenu .op:hover,#frModeMenu .op:hover{background:rgba(255,255,255,.08)}
  #modelMenu .op.cur,#frModeMenu .op.cur{color:#7aaaff;background:rgba(122,170,255,.15)}
  #frModeTip{position:fixed;z-index:60;display:none;max-width:300px;padding:8px 10px;background:#1b1b1e;border:1px solid rgba(255,255,255,.14);border-radius:10px;font:12px/1.55 system-ui;color:#ddd;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;white-space:normal}
  #modelMenu .op .badge,#frModeMenu .op .badge{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .send{width:38px;height:38px;border-radius:50%;background:var(--accent);border:0;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:.14s}
  .send:hover:not(:disabled){filter:brightness(1.12)}
  .send:disabled{opacity:.4;cursor:not-allowed}

  #mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
  #mask.show{display:block}
  /* 会话组管理弹层 */
  #groupsModal{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);width:min(780px,94vw);height:calc(100% - 300px);max-height:min(84vh,860px);min-height:240px;container-type:inline-size;container-name:gm;background:#232326;border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:0 18px 48px rgba(0,0,0,.55);display:none;flex-direction:column;z-index:25;overflow:hidden}
  #groupsModal.show{display:flex}
  .gm-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .gm-hint{font-size:11px;color:var(--muted)}
  .gm-new{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .gm-new input{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:9px;color:var(--fg);padding:7px 11px;font-size:13px;outline:none}
  .gm-new input:focus{border-color:rgba(122,170,255,.55)}
  #gmList{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  #gmList::-webkit-scrollbar{width:9px}
  #gmList::-webkit-scrollbar-track{background:transparent}
  #gmList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px;border:2px solid transparent;background-clip:content-box}
  #gmList:hover::-webkit-scrollbar-thumb{background:rgba(255,255,255,.26);background-clip:content-box}
  .gm-row{display:flex;align-items:center;min-width:0;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.03)}
  .gm-row.active{border-color:rgba(122,170,255,.5);background:rgba(122,170,255,.08)}
  .gm-key{font:12px/1 var(--mono);color:#7aaaff;background:rgba(122,170,255,.12);border:1px solid rgba(122,170,255,.3);border-radius:7px;padding:5px 8px;flex:0 0 auto}
  .gm-info{flex:1 1 auto;min-width:0;overflow:hidden}
  .gm-title{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gm-ids{font:10.5px/1.5 var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gm-st{display:flex;gap:6px;flex:0 0 auto}
  .gm-dot{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:var(--fg2)}
  .gm-dot.run{color:#f0c674;border-color:rgba(240,198,116,.4);background:rgba(240,198,116,.08)}
  .gm-dot.miss{color:#e06c75;border-color:rgba(224,108,117,.4);background:rgba(224,108,117,.08)}
  .gm-ops{display:flex;gap:6px;flex:0 0 auto}
  .gm-ops button{padding:4px 10px;font-size:12px;border-radius:8px}
  .gm-perm{flex:0 0 auto;max-width:168px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:var(--fg2);font-size:11.5px;padding:4px 8px;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
  .gm-perm:focus{border-color:rgba(122,170,255,.55);color:var(--fg)}
  .gm-foot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:var(--muted)}
  .gm-empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:12.5px}

  #drawer{position:absolute;top:0;right:0;bottom:0;width:min(430px,92vw);background:var(--bg2);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:20;box-shadow:-10px 0 30px rgba(0,0,0,.35)}
  #drawer.open{transform:none}
  #drawer .dh{display:flex;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);gap:10px}
  #drawer .db{flex:1;overflow:auto;padding:14px 15px}
  #drawer .db::-webkit-scrollbar{width:9px}
  #drawer .db::-webkit-scrollbar-thumb{background:#2d333b;border-radius:5px}
  h4{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600}
  .kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12.5px}
  .kv .k{color:var(--fg2)} .kv .v{font-family:var(--mono)}
  .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.err{color:var(--err)}
  .sep{height:1px;background:var(--line);margin:15px 0}
  .steps{display:flex;flex-wrap:wrap;gap:6px}
  .st{padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg3);font:12px var(--mono);color:var(--fg2)}
  .st.done{border-color:#238636;background:rgba(35,134,54,.16);color:#7ee787}
  .st.cur{border-color:#9e6a03;background:rgba(158,106,3,.18);color:#e3b341}
  .st.todo{opacity:.5}
  .ev{font:11.5px/1.5 var(--mono);color:var(--fg2);border-left:2px solid var(--line);padding:2px 0 2px 9px;margin-bottom:5px;word-break:break-all}
  .ev b{color:var(--fg)} .ev .t{color:var(--muted)}
  .ev.hot{border-left-color:var(--accent)}
  .cfgrow{display:flex;gap:8px;margin-top:9px;align-items:center;flex-wrap:wrap}
  .cfgrow input{width:96px;background:var(--bg3);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 8px;font:12px var(--mono)}

  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:12.5px;opacity:0;transition:.22s;pointer-events:none;z-index:99;max-width:70vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{border-color:#8b1a1a;color:#ffb4b4}

  body.embed header{padding:8px 14px}
  body.embed #chat{padding:16px 18px 6px}
  body.embed footer{padding:8px 14px 12px}

  /* ── 极窄窗口适配（DSH 侧栏拖到最窄时；按容器宽度逐级降级） ───────────── */
  @media (max-width: 560px){
    header{padding:0 10px;gap:6px;height:auto;min-height:26px;flex-wrap:nowrap;overflow:hidden}

<script>
/* 从父页面（DSH 主界面）同步官方主题 token —— 同源 iframe 可直接读父文档计算样式。
   这样本页所有 var(--dsw-alias-*) 都变成 DSH 的实时真实色值；
   无父页（浏览器独立打开）时保持 :root 里的 fallback。每 3s 兜底重同步 + focus 时同步。 */
(function(){
  var NAMES=['--dsw-alias-bg-base','--dsw-alias-bg-layer-1','--dsw-alias-bg-layer-2','--dsw-alias-bg-overlay',
    '--dsw-alias-border-l1','--dsw-alias-border-l2','--dsw-alias-brand-primary',
    '--dsw-alias-label-primary','--dsw-alias-label-secondary',
    '--dsw-alias-state-success-primary','--dsw-alias-state-warn-primary',
    '--dsw-alias-state-error-primary','--dsw-alias-state-idle-primary','--dsw-specific-sidebar-fill'];
  function sync(){
    try{
      if(!window.parent||window.parent===window)return;
      var ps=window.parent.getComputedStyle(window.parent.document.documentElement);
      var changed=false;
      NAMES.forEach(function(n){
        var v=ps.getPropertyValue(n);
        if(v){v=v.trim();if(v){document.documentElement.style.setProperty(n,v);changed=true}}
      });
      // ★ 面板底色 = DSH 会话区实底色（实测 rgb(21,21,23)=#151517 深灰，
      //   近黑 bg-base 在灰色侧边栏衬托下对比过强——用户反馈改深灰）
      try{
        var col=window.parent.document.querySelector('[class*="centerCol"]');
        if(col){
          var bg=window.parent.getComputedStyle(col).backgroundColor;
          if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent')document.documentElement.style.setProperty('--panel-fill',bg);
        }
      }catch(e){}
      return changed;
    }catch(e){return false}
  }
  sync();
  setInterval(sync,3000);
  window.addEventListener('focus',sync);
})();
</script>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id) }
  var EMBED = /(\?|&)embed=1/.test(location.search)
  if (EMBED) document.body.classList.add('embed')
  var lastChatKey = '', lastCount = 0

  // ── 全局报错展示（不吞错）─────────────────────────────────────────────
  var _errSeen = {}
  function showErr(kind, msg, extra){
    try {
      var key = kind + '|' + msg
      if (_errSeen[key]) return             // 同样的错只报一次，避免刷屏
      _errSeen[key] = 1
      var bar = $('errBar'), txt = $('errTxt')
      if (!bar || !txt) return
      var line = '[' + new Date().toLocaleTimeString() + '] ' + kind + ': ' + msg
      if (extra) line += '\n' + extra
      txt.textContent = (txt.textContent ? txt.textContent + '\n' : '') + line
      bar.classList.add('show')
      try { console.error('[快速反应]', kind, msg, extra || '') } catch (e) {}
    } catch (e) {}
  }
  window.addEventListener('error', function(e){
    showErr('JS 错误', (e && e.message) || '未知错误', (e && e.filename ? e.filename + ':' + e.lineno + ':' + e.colno : ''))
  })
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason
    showErr('未处理的 Promise', (r && (r.message || r)) || '未知', (r && r.stack ? String(r.stack).split('\n').slice(0, 3).join('\n') : ''))

  function toast(msg, isErr){
    var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '')
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.className = 'toast' }, 2600)
  }
  function api(path, opts){
    var url = '/fr/api' + path
    return fetch(url, Object.assign({ headers:{ 'content-type':'application/json' }, credentials:'same-origin' }, opts||{}))
      .then(function(r){
        return r.text().then(function(txt){
          var j = null
          try { j = txt ? JSON.parse(txt) : {} } catch (e) {
            // 非 JSON（多半是 500 崩溃页或代理错误）→ 把原文截断展示
            throw new Error('HTTP ' + r.status + ' ' + (r.statusText || '') + ' · 响应不是 JSON: ' + String(txt || '').slice(0, 300))
          }
          if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status + ' ' + (r.statusText || '')))
          return j || {}
        })
      })
      .catch(function(err){
        // 网络层失败（服务未起 / fetch failed）也统一带上网址
        if (err && err.name === 'TypeError') throw new Error('请求失败 ' + url + '：' + (err.message || '网络错误'))
        throw err
      })
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c] }) }
  function fmtMs(ms){ return ms==null ? '—' : (ms<1000 ? Math.round(ms)+'ms' : (ms/1000).toFixed(1)+'s') }
  function fmtK(n){ return n==null ? '—' : (n>=1000 ? (n/1000).toFixed(1)+'k' : String(n)) }
  function tOf(s){ s = String(s||''); return s.length > 19 ? s.slice(11,19) : s }

  // 系统注入话术（防御性兜底：服务端已过滤一遍）
  var SYS_RE = /^(【快速反应|<system-reminder|Current runtime context|Time sampled while|本环境装有|You are an AI agent|This is an automatically generated)/

  // 后台内部话术（分诊/判定/verdict）不该出现在用户视野
  var BACK_INTERNAL_RE = /^(判定：|判定:|已写\s*verdict|已更新\s*verdict|无需调整|short:\s*)/

  function renderChat(d){
    var chat = d.chat || {}
    var rows = []
    // ★ 不标人：只有两个角色（用户 / Agent），用户靠右浅灰气泡，Agent 左侧纯文本
    ;(chat.front || []).forEach(function(m){
      if (m.role === 'notice') { rows.push({ m:m, cls:'notice' }); return }
      if (m.role !== 'user' && m.role !== 'agent') return
      if (m.role === 'user' && (SYS_RE.test(String(m.text||'')) || /<system-reminder>/.test(String(m.text||'')))) return
      // 后台分诊话术可能被投进前台，同样隐藏（用户实测：不该看到"判定：无需调整，已写 verdict.md"）
      if (m.role === 'agent' && BACK_INTERNAL_RE.test(String(m.text||''))) return
      rows.push({ m:m, cls: m.role === 'user' ? 'me' : '' })
    })
    // ★ 不再渲染 chat.back：后台是内部角色，它的「判定/verdict」不是用户消息；
    //   之前混进来还会因为没有 at 时间戳被排到最底部（用户实测顺序错乱）。
    rows.sort(function(a,b){
      var ta = Date.parse(String(a.m.at || '')), tb = Date.parse(String(b.m.at || ''))
      if (!isNaN(ta) && !isNaN(tb) && ta !== tb) return ta - tb
      return 0   // 时间不可比时保持原有顺序（稳定排序）
    })
    var running = !!(d.front && d.front.phase === 'running')
    var tail = rows.length ? rows[rows.length-1].m : null
    var key = rows.length + '|' + (tail ? String(tail.at) + String(tail.text).slice(0,40) + '|' + String(tail.think || '').length : '') + '|' + (running ? 'R' : '')
    if (key === lastChatKey) return
    lastChatKey = key
    var box = $('chat')
    var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80
    var typing = running ? '<div class="msg typing"><span class="dots"><i></i><i></i><i></i></span>前台正在处理…</div>' : ''
    if (!rows.length){
      box.innerHTML = typing || '<div class="empty"><div class="empty-title">随叫随到</div></div>'
      if (atBottom) box.scrollTop = box.scrollHeight
      return
    }
    // 用会话里的用户消息填充 ↑ 历史（刷新后也能调出上一条）
    try {
      var us = rows.filter(function(r){ return r.m.role === 'user' }).map(function(r){ return String(r.m.text || '') }).filter(Boolean)
      if (us.length > sentHistory.length) sentHistory = us.slice(-30)
    } catch (err) {}
    box.innerHTML = rows.map(function(r){
      if (r.cls === 'notice') return '<div class="notice">'+esc(r.m.text)+'</div>'
      // 思考过程：浅灰折叠块（仅 Agent 回复，默认收起）
      var think = (r.m.role === 'agent' && r.m.think) ? '<details class="think"><summary>思考过程</summary><div class="tt">'+esc(r.m.think)+'</div></details>' : ''
      return '<div class="msg '+r.cls+'"><div class="bubble">'+think+'<div class="txt">'+esc(r.m.text)+'</div><button class="copy" title="复制这条消息">复制</button></div></div>'
    }).join('') + typing
    if (atBottom) box.scrollTop = box.scrollHeight
  }

  function renderTech(d){
    var done = (d.state && d.state.done) || 'S0'
    var total = (d.steps && d.steps.length) || 0
    var doneNo = parseInt(String(done).replace(/\D/g,''),10) || 0
    var pct = total ? Math.min(100, Math.round(doneNo/total*100)) : 0
    $('progBox').innerHTML =
      '<span class="k">状态</span><span class="v">'+esc((d.state&&d.state.status)||'—')+'</span>' +
      '<span class="k">进度</span><span class="v">'+doneNo+' / '+total+'（'+pct+'%）</span>'
    var sl = []
    ;(d.steps||[]).forEach(function(f){
      var n = parseInt(String(f).replace(/\D/g,''),10)
      var cls = n <= doneNo ? 'done' : (n === doneNo+1 ? 'cur' : 'todo')
      sl.push('<span class="st '+cls+'">'+esc(String(f).replace('.md',''))+'</span>')
    })
    $('steps').innerHTML = sl.join('') || '<span style="color:var(--muted);font-size:12px">无步骤</span>'

    var ms = d.milestones || 0
    var okLoop = ms > 0 && ms === total
    $('loopBox').innerHTML =
      '<span class="k">里程碑</span><span class="v">'+ms+'</span>' +
      '<span class="k">步骤</span><span class="v">'+total+'</span>' +
      '<span class="k">一致性</span><span class="v '+(okLoop?'ok':(ms?'warn':''))+'">'+(okLoop?'✓ 对齐':(ms?'⚠ 不一致':'—'))+'</span>' +
      '<span class="k">route</span><span class="v">'+(d.routeRendered?'fr_route':'手写')+' · '+fmtK(d.routeSize)+'字</span>' +
      '<span class="k">哨兵</span><span class="v">'+(d.renderedSn==null?'—':d.renderedSn)+'</span>'

    var ff = d.firstFrameMs
    $('metrics').innerHTML =
      '<span class="k">首帧</span><span class="v '+(ff!=null&&ff<15000?'ok':(ff?'warn':''))+'">'+fmtMs(ff)+'</span>' +
      '<span class="k">投递</span><span class="v ok">'+fmtMs(d.lastWatchMs)+'</span>' +
      '<span class="k">前台上下文</span><span class="v">'+fmtK(d.ctx&&d.ctx.front)+' / '+fmtK(d.limits&&d.limits.front)+'</span>' +
      '<span class="k">后台上下文</span><span class="v">'+fmtK(d.ctx&&d.ctx.back)+' / '+fmtK(d.limits&&d.limits.back)+'</span>' +
      '<span class="k">最近压缩</span><span class="v">'+(d.lastCompact?(fmtK(d.lastCompact.before)+'→'+fmtK(d.lastCompact.after)):'—')+'</span>'

    var wb = d.wakeBy||{}, wl=[]
    Object.keys(wb).forEach(function(k){ wl.push('<span class="k">'+esc(k)+'</span><span class="v">'+wb[k]+'</span>') })
    $('wakes').innerHTML = wl.join('') || '<span class="k">—</span><span class="v">0</span>'

    var t = d.tools||{}
    $('counters').innerHTML =
      '<span class="k">工具</span><span class="v">'+(t.total||0)+'</span>' +
      '<span class="k">失败</span><span class="v '+(t.failTotal?'warn':'')+'">'+(t.failTotal||0)+'</span>' +
      '<span class="k">T3</span><span class="v">'+(d.t3Blocked||0)+'</span>'

    var ev = []
    ;(d.recent||[]).slice().reverse().forEach(function(x){
      var det = ''; try { det = x.detail ? JSON.stringify(x.detail) : '' } catch(e){}
      if (det.length > 70) det = det.slice(0,70)+'…'
      var hot = /freeze|route-rendered|escalate|interrupt|step-delivered|watcher-fire|api-task/.test(x.kind||'')
      ev.push('<div class="ev'+(hot?' hot':'')+'"><span class="t">'+esc(tOf(x.at))+'</span> <b>'+esc(x.kind)+'</b> '+esc(det)+'</div>')
    })
    $('events').innerHTML = ev.join('') || '<span style="color:var(--muted);font-size:12px">暂无</span>'

    if (!renderTech._cfg){
      renderTech._cfg = true
      $('cFront').value = (d.limits && d.limits.front) || 60000
      $('cBack').value  = (d.limits && d.limits.back)  || 60000
    }
  }

  function renderHead(d){
    var run = (d.front && d.front.phase==='running') || (d.back && d.back.phase==='running')
    $('live').className = 'dot ' + (run ? 'busy' : 'on')
    // ★ 接线状态可见（2026-10-18）：未接线 / 自愈中 / 正常 要能一眼区分
    var w = d.wiring || {}

    var backTxt = d.back ? d.back.phase : (w.state === 'healing' ? '自愈中…' : '未接线')
    $('fphase').textContent = frontTxt
    $('bphase').textContent = backTxt

      var bm = (d.models.back && d.models.back.model) || d.models.model

      var bp = (d.models.back && d.models.back.provider) || d.models.provider || ''
      var act = d.models.actual || {}
      if (act.front || act.back){

        modelSel.back = act.back || { provider: bp, model: bm }
        modelSel.both = modelSel.front

        fm = modelSel.front.model; bm = modelSel.back.model

        $('modelLabel').textContent = lab2(fm)

      $('modelTxt').textContent = (fm === bm) ? ('前后台 ' + labOf(fm)) : ('前台 ' + labOf(fm) + ' · 后台 ' + labOf(bm))
      $('modelChip').title = '前台：' + fp + ' / ' + fm + '\n后台：' + bp + ' / ' + bm

    }

    if (d.lastError && d.lastError.message){
      var em = String(d.lastError.message)
      var friendly = em
      if (/insufficient|balance|欠费|余额|quota|credit|402/i.test(em)) friendly = '账户余额不足或已欠费（请充值后重试）—— 原始信息：' + em
      else if (/401|unauthorized|invalid.*key|api.?key/i.test(em)) friendly = '模型密钥无效或已过期（请重新登录/换 key）—— 原始信息：' + em
      else if (/429|rate.?limit|too many/i.test(em)) friendly = '请求过于频繁被限流（稍后重试）—— 原始信息：' + em
      showErr('模型调用失败（' + (d.lastError.role === 'front' ? '前台' : d.lastError.role === 'back' ? '后台' : '会话') + '）', friendly)
      $('hint').textContent = '模型出错：' + (friendly.length > 40 ? friendly.slice(0, 40) + '…' : friendly)
    }
    // ★ 模型/回合错误（余额不足、401、限流…）——必须在页面上看得见
    if (d.lastError && d.lastError.message){
      var em = String(d.lastError.message)
      var friendly = em
      if (/insufficient|balance|欠费|余额|quota|credit|402/i.test(em)) friendly = '账户余额不足或已欠费（请充值后重试）—— 原始信息：' + em
      else if (/401|unauthorized|invalid.*key|api.?key/i.test(em)) friendly = '模型密钥无效或已过期（请重新登录/换 key）—— 原始信息：' + em
      else if (/429|rate.?limit|too many/i.test(em)) friendly = '请求过于频繁被限流（稍后重试）—— 原始信息：' + em
      showErr('模型调用失败（' + (d.lastError.role === 'front' ? '前台' : d.lastError.role === 'back' ? '后台' : '会话') + '）', friendly)
      $('hint').textContent = '模型出错：' + (friendly.length > 40 ? friendly.slice(0, 40) + '…' : friendly)
    }
    // ★ 权限按钮标签同步（不再只靠 initPermMenu 的 15s 轮询）
    try {

      var pl = document.getElementById('permLabel')
      var PMAP = { 'read-only': '只读', 'workspace-write': '工作区可写', 'danger-full-access': '完全权限', '': '权限' }
      if (pl) { pl.textContent = PMAP[pv] !== undefined ? PMAP[pv] : (pv || '权限'); try { localStorage.setItem('fr_perm', pv) } catch (e) {} }
      var pb = document.getElementById('btnPerm'); if (pb) pb.title = '前后台权限：' + (PMAP[pv] || pv || '未知')

  }

  // ── 模型切换（DSH 同位置：输入栏右下、发送键左侧）────────────────────────
  var modelCache = null, modelOpen = false, modelRole = 'both'
  // 每个角色当前生效的模型（来自 /status 的 models.front/back；切换成功后立即更新，用于菜单高亮）
  var modelSel = { both: null, front: null, back: null }
  function pickSel(role){
    var key = (role === 'front' || role === 'back') ? role : 'both'
    return modelSel[key] || null
  }
  function loadModels(){
    if (modelCache) return Promise.resolve(modelCache)
    return api('/models').then(function(m){ modelCache = m; return m }).catch(function(){ return { providers: [], current: {} } })
  }
  // 常见模型的友好名（原始 id 仍显示在括号里，便于排障）
  var MODEL_LABELS = {
    'deepseek-flash': 'DeepSeek V4.1 Flash',
    'deepseek-v4.1-flash': 'DeepSeek V4.1 Flash',
    'deepseek-v4-pro': 'DeepSeek V4 Pro',
    'deepseek-chat': 'DeepSeek Chat',
    'hy3': '混元 3', 'hy3-preview': '混元 3',
    'hy4': '混元 4', 'hy4-preview': '混元 4'
  }
  function modelLabel(mo){ return MODEL_LABELS[mo] || mo }
  function renderModelMenu(m){
    var sels = (modelRole === 'both')
      ? [modelSel.front, modelSel.back, modelSel.both].filter(Boolean)
      : [pickSel(modelRole)].filter(Boolean)
    if (!sels.length && m.current) sels = [{ provider: m.current.provider, model: m.current.model }]
    function isSel(provider, mo){
      return sels.some(function(x){ return x && x.model === mo && (!x.provider || x.provider === provider) })
    }
    var avail = (m.providers || []).filter(function(p){ return (p.models || []).length })
    var unavail = (m.providers || []).filter(function(p){ return !(p.models || []).length })
    // ★ 置顶副本（model-pin-top）：当前选中的模型排在最上面，方便快速确认/切换
    var pinned = []
    avail.forEach(function(p){
      ;(p.models || []).forEach(function(mo){
        if (isSel(p.provider, mo)) pinned.push({ provider: p.provider, model: mo })
      })
    })
    var pinHtml = ''
    if (pinned.length){
      pinHtml = '<div class="grp">当前（置顶）</div>'
      pinned.forEach(function(it){

          '<span style="color:#7aaaff">▲</span>' + esc(lab) +
          (lab !== it.model ? '<span class="badge">' + esc(it.model) + '</span>' : '') +
          '<span class="badge">' + esc(it.provider) + '</span></div>'
      })
      pinHtml += '<div class="grp" style="opacity:.6">全部模型</div>'
    }
    var html = pinHtml
    avail.forEach(function(p){
      html += '<div class="grp">' + esc(p.provider) + '</div>'
      ;(p.models || []).forEach(function(mo){
        var isCur = isSel(p.provider, mo)

        html += '<div class="op' + (isCur ? ' cur' : '') + '" data-p="' + esc(p.provider) + '" data-m="' + esc(mo) + '">' +

  function toggleModelMenu(force){

  })
  document.addEventListener('fr:menu-others-open', function(ev){

  })
  $('btnModel').onclick = function(e){ e.stopPropagation(); toggleModelMenu() }
  $('modelMenu').onclick = function(e){

    var roleEl = e.target && e.target.closest ? e.target.closest('[data-role]') : null
    if (roleEl && roleEl.dataset.role){

  // ★ Phase 6：点空白关闭（抽屉/会话组/模型菜单）+ ESC

        var active = (j.groups || []).filter(function(g){ return g.active })[0]
        if (active) {
          return fetch('/fr/api/groups', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'policy', key: active.key, preset: preset }) })
        }
        return fetch('/fr/api/config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ permissionPreset: preset }) })
      }).then(function(){
        cur = preset                       // ★ 立即记住，高亮马上跟上
        try { localStorage.setItem('fr_perm', preset) } catch (e) {}
        render()
        toast('权限已设为 ' + (preset || '跟随 DSH'))
        toggle(false); load()
      })
        .catch(function(){ toast('设置权限失败', true) })
    }
    document.addEventListener('click', function(e){
      var t = e.target; if (!t || !t.closest) return
      if (open && !t.closest('#permQuickMenu') && !t.closest('#btnPerm')) toggle(false)
    })
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && open) toggle(false) })
    function refresh(){
      fetch('/fr/api/status').then(function(r){ return r.json() }).then(function(j){
        var p = j.permissions || {}
        cur = p.front || p.default || ''
        render()
      }).catch(function(){})
    }
    refresh(); setInterval(refresh, 15000)
  })();

  // ── 三个下拉菜单互斥：打开一个就广播让其它关掉自己 ────────────────
  window.__frCloseOtherMenus = function(keep){
    try { document.dispatchEvent(new CustomEvent('fr:menu-others-open', { detail: { keep: keep } })) } catch (e) {}
  }

  // ── T3 待批准卡片（每 2 秒拉一次）────────────────────────────────────
  function renderT3(){
    fetch('/fr/api/confirm', { cache: 'no-store' }).then(function(r){ return r.json() }).then(function(j){
      var box = document.getElementById('t3Box'); if (!box) return
      var list = (j && j.pending) || []
      if (!list.length){ box.style.display = 'none'; box.innerHTML = ''; return }
      box.style.display = 'block'
      box.innerHTML = list.map(function(it){
        return '<div style="padding:10px 12px;background:rgba(200,140,40,.12);border:1px solid rgba(230,170,60,.6);border-radius:10px;color:#f0d090;font:12px/1.6 ui-monospace,Consolas,monospace">' +
          '<div style="font-weight:600;margin-bottom:6px;color:#ffd88a">⚠ 需要你批准的危险操作（' + it.id + '）</div>' +
          '<div style="white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;margin-bottom:8px">' + esc(it.cmd) + '</div>' +
          '<div style="display:flex;gap:8px">' +
          '<button data-t3="ok" data-step="' + esc(it.id) + '" style="padding:5px 14px;border-radius:8px;border:1px solid rgba(120,220,120,.6);background:rgba(60,180,80,.2);color:#9df0a9;cursor:pointer;font-size:12px">允许执行</button>' +
          '<button data-t3="no" data-step="' + esc(it.id) + '" style="padding:5px 14px;border-radius:8px;border:1px solid rgba(220,120,120,.6);background:rgba(180,60,60,.2);color:#ffb3b3;cursor:pointer;font-size:12px">拒绝</button>' +
          '</div></div>'
      }).join('')
    }).catch(function(){})
  }
  document.addEventListener('click', function(e){
    var t = e.target; if (!t || !t.dataset || !t.dataset.t3) return
    var step = t.dataset.step, action = t.dataset.t3 === 'ok' ? 'approve' : 'reject'
    fetch('/fr/api/confirm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: action, step: step }) })
      .then(function(){ toast(action === 'approve' ? '已批准，前台可继续' : '已拒绝'); renderT3(); load() })
      .catch(function(){ toast('操作失败', true) })
  })
  renderT3(); setInterval(renderT3, 2000)
  load().then(nextPoll, nextPoll)
})();
</script>
<script>
// 模式选择器（2026-10-24：与「切换模型」同款按钮 + 弹出菜单；悬停 0.6s 显示简介）
(function(){
var fallback={quick:["速答","不编排：前台直接答，最多查一眼"],consult:["咨询","深度分析：后台可查资料，只产出 analysis.md，不写步骤"],retrieval:["检索","长检索：前台自己并行查，不惊动后台"],coding:["编码","标准编排：后台写路线+步骤，前台执行"]};
var btn=document.getElementById("btnMode"),menu=document.getElementById("frModeMenu"),label=document.getElementById("frModeLabel"),mark=document.getElementById("frModeLockMark");
if(!btn||!menu)return;
var info={},cur="",locked=false,open=false,hoverTimer=null;
for(var k in fallback) info[k]={label:fallback[k][0],summary:fallback[k][1]};
var tip=document.createElement("div");tip.id="frModeTip";document.body.appendChild(tip);
function api(p,o){return fetch(p,o).then(function(r){return r.json()})}
function render(){
  var h='<div class="grp">任务模式</div>';
  for(var k in info){h+='<div class="op'+(k===cur?" cur":"")+'" data-k="'+k+'" data-tip="'+info[k].summary.replace(/"/g,"&quot;")+'">'+info[k].label+'<span class="badge">'+k+'</span></div>'}
  h+='<div class="grp">锁定（禁止自动判型）</div><div class="op" data-lock="1">'+(locked?"🔒 已锁定（点击解锁）":"🔓 未锁定（点击锁定）")+'</div>';
  menu.innerHTML=h;
  label.textContent=(info[cur]&&info[cur].label)||"模式";
  mark.textContent=locked?"🔒":"";
}
function hideTip(){tip.style.display="none"}
function showTip(op){
  var txt=op&&op.dataset&&op.dataset.tip;
  if(!txt)return;
  tip.textContent=txt;tip.style.display="block";
  var r=op.getBoundingClientRect();
  var w=tip.offsetWidth,h=tip.offsetHeight;
  var left=Math.max(8,Math.min(r.left,window.innerWidth-w-8));
  var top=r.top-h-8;
  if(top<8)top=r.bottom+8;
  tip.style.left=left+"px";tip.style.top=top+"px";
}
function armTip(e){
  var op=e.target&&e.target.closest?e.target.closest(".op[data-tip]"):null;
  clearTimeout(hoverTimer);hideTip();
  if(!op)return;
  hoverTimer=setTimeout(function(){showTip(op)},600);
}
function toggle(f){open=typeof f==="boolean"?f:!open;if(open&&window.__frCloseOtherMenus)window.__frCloseOtherMenus("mode");menu.classList[open?"add":"remove"]("show");if(open)render();else{clearTimeout(hoverTimer);hideTip()}}
document.addEventListener("fr:menu-others-open",function(ev){if(ev&&ev.detail&&ev.detail.keep==="mode")return;if(open){open=false;menu.classList.remove("show");clearTimeout(hoverTimer);hideTip()}});
document.addEventListener("fr:menu-others-open",function(ev){if(ev&&ev.detail&&ev.detail.keep==="mode")return;if(open){open=false;menu.classList.remove("show");clearTimeout(hoverTimer);hideTip()}});
btn.onclick=function(e){e.stopPropagation();toggle()};
menu.addEventListener("mouseover",armTip);
menu.addEventListener("mouseout",function(){clearTimeout(hoverTimer);hideTip()});
menu.onclick=function(e){
  var op=e.target&&e.target.closest?e.target.closest(".op"):null;
  if(!op)return;
  if(op.dataset.lock){locked=!locked;api("/fr/api/mode",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({locked:locked})}).then(function(){render();try{load()}catch(_){}});return}
  if(!op.dataset.k)return;
  api("/fr/api/mode",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:op.dataset.k})}).then(function(){cur=op.dataset.k;render();toggle(false);try{load()}catch(_){}});
};
document.addEventListener("click",function(e){var t=e.target;if(!t||!t.closest)return;if(open&&!t.closest("#frModeMenu")&&!t.closest("#btnMode"))toggle(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&open)toggle(false)});
function refresh(){api("/fr/api/mode").then(function(j){
  if(j&&j.presetsInfo&&j.presetsInfo.length){info={};for(var i=0;i<j.presetsInfo.length;i++){var p=j.presetsInfo[i];info[p.key]={label:p.label,summary:p.summary}}}
  cur=(j&&j.mode)||"coding";locked=!!(j&&j.locked);render();
})}
refresh();setInterval(refresh,15000);
})();
</script>
